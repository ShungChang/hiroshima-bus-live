name: Live data smoke check
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/live-smoke.yml
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and decode official GTFS once
        run: node scripts/live-smoke.mjs
